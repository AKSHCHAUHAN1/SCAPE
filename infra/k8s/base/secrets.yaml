apiVersion: v1
kind: Secret
metadata:
  name: scape-secrets
  namespace: scape
type: Opaque
stringData:
  POSTGRES_PASSWORD: "replace-with-secure-postgres-password"
  JWT_PRIVATE_KEY: "replace-with-RS256-private-PEM"
  JWT_PUBLIC_KEY: "replace-with-RS256-public-PEM"
  GITHUB_APP_ID: "123456"
  GITHUB_APP_PRIVATE_KEY_PATH: "/secrets/github-app-key.pem"
  GITHUB_WEBHOOK_SECRET: "replace-with-github-webhook-secret"
  GITHUB_APP_INSTALLATION_ID: "987654"

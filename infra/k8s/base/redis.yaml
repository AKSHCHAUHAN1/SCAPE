apiVersion: apps/v1
kind: Deployment
metadata:
  name: scape-redis
  namespace: scape
  labels:
    app.kubernetes.io/name: scape-redis
    app.kubernetes.io/component: queue-broker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scape-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scape-redis
        app.kubernetes.io/component: queue-broker
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: redis-storage
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: redis-storage
          persistentVolumeClaim:
            claimName: scape-redis-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scape-redis-pvc
  namespace: scape
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: scape-redis
  namespace: scape
  labels:
    app.kubernetes.io/name: scape-redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app.kubernetes.io/name: scape-redis

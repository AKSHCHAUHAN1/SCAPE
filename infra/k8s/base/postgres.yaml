apiVersion: apps/v1
kind: Deployment
metadata:
  name: scape-postgres
  namespace: scape
  labels:
    app.kubernetes.io/name: scape-postgres
    app.kubernetes.io/component: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scape-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scape-postgres
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - configMapRef:
                name: scape-config
            - secretRef:
                name: scape-secrets
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "scape_user", "-d", "scape"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "scape_user", "-d", "scape"]
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: scape-postgres-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scape-postgres-pvc
  namespace: scape
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: scape-postgres
  namespace: scape
  labels:
    app.kubernetes.io/name: scape-postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app.kubernetes.io/name: scape-postgres

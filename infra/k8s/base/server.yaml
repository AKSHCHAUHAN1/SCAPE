apiVersion: apps/v1
kind: Deployment
metadata:
  name: scape-server
  namespace: scape
  labels:
    app.kubernetes.io/name: scape-server
    app.kubernetes.io/component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: scape-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scape-server
        app.kubernetes.io/component: api
    spec:
      initContainers:
        - name: db-migrate
          image: scape-server:latest
          command: ["npm", "run", "db:migrate"]
          envFrom:
            - configMapRef:
                name: scape-config
            - secretRef:
                name: scape-secrets
      containers:
        - name: server
          image: scape-server:latest
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: scape-config
            - secretRef:
                name: scape-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: scape-server
  namespace: scape
  labels:
    app.kubernetes.io/name: scape-server
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app.kubernetes.io/name: scape-server

apiVersion: apps/v1
kind: Deployment
metadata:
  name: scape-client
  namespace: scape
  labels:
    app.kubernetes.io/name: scape-client
    app.kubernetes.io/component: frontend-portal
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: scape-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scape-client
        app.kubernetes.io/component: frontend-portal
    spec:
      containers:
        - name: client
          image: scape-client:latest
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: scape-client
  namespace: scape
  labels:
    app.kubernetes.io/name: scape-client
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app.kubernetes.io/name: scape-client

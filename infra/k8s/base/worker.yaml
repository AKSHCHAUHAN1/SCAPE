apiVersion: apps/v1
kind: Deployment
metadata:
  name: scape-worker
  namespace: scape
  labels:
    app.kubernetes.io/name: scape-worker
    app.kubernetes.io/component: provisioning-worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: scape-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scape-worker
        app.kubernetes.io/component: provisioning-worker
    spec:
      containers:
        - name: worker
          image: scape-server:latest
          command: ["node", "-e", "import('./dist/modules/provisioning/provisioning.worker.js');"]
          envFrom:
            - configMapRef:
                name: scape-config
            - secretRef:
                name: scape-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi

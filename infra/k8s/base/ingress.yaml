apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scape-ingress
  namespace: scape
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: scape.internal
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: scape-server
                port:
                  number: 3000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: scape-server
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scape-client
                port:
                  number: 80

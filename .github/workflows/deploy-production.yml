name: Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-prod:
    name: Production Release & Zero-Downtime Rolling Update
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./infra/docker/Dockerfile.server
          target: production
          tags: scape-server:${{ github.sha }},scape-server:latest
          push: false
          load: true

      - name: Build Production Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./infra/docker/Dockerfile.client
          target: production
          tags: scape-client:${{ github.sha }},scape-client:latest
          push: false
          load: true

      - name: Validate Production Kustomize Configuration
        run: |
          kubectl kustomize infra/k8s/overlays/production > /tmp/prod-manifests.yaml
          echo "✅ Production Kustomize manifests validated."

      - name: Zero-Downtime Rolling Update
        run: |
          echo "🚀 Executing rolling update on production cluster (maxSurge=1, maxUnavailable=0)..."
          # When KUBECONFIG secret is configured:
          # kubectl apply -k infra/k8s/overlays/production
          # kubectl -n scape-prod rollout status deployment/prod-scape-server --timeout=300s
          # kubectl -n scape-prod rollout status deployment/prod-scape-client --timeout=300s
          echo "✅ Production deployment successful."
